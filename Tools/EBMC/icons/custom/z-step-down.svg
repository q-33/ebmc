<!-- EBMC custom icon "z-step-down": Z offset (baby-step) down, a bold filled triangle pointing down, so the button reads at a glance while the first layer prints. Original work for EBMC (East Bay Makers Club), drawn on Lucide's 24-unit grid and stroke style; not part of Lucide. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 18l8-11H4z" fill="#000" />
</svg>
